<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neyra Servicios | Catálogo Editable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Firebase SDK (Versión Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<!-- jsPDF y html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --dark1:#0a192f; --dark2:#1e3c72; --dark3:#2a5298;
    --orange:#f39c12; --green:#25d366;
    --bg-block:#f8fafc; --white:#ffffff; --border:#e2e8f0;
    --text-dark:#0f1f38; --text-muted:#5b6b82;
    --page-w:900px; --page-h:1270px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Roboto',sans-serif; background:#dfe6ee; color:var(--text-dark);}

  /* ===== PANTALLA DE LOGIN ===== */
  #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--dark1); z-index:9999; 
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; transition:opacity 0.3s;}
  .login-box { background:#fff; color:var(--dark1); padding:40px; border-radius:8px; width:100%; max-width:380px; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
  .login-box h2 { margin:0 0 20px; font-size:20px; text-align:center; color:var(--dark2); }
  .login-box input { width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; font-size:14px; }
  .login-box button { width:100%; background:var(--orange); color:#fff; border:none; padding:12px; font-weight:700; font-size:15px; border-radius:4px; cursor:pointer; transition:0.2s;}
  .login-box button:hover { filter:brightness(1.1); }
  .login-error { color:#c0392b; font-size:12px; margin-bottom:10px; display:none; text-align:center; font-weight:700; }
  #appContainer { display:none; } /* Oculto hasta login */

  /* ===== TOOLBAR ===== */
  #toolbar{position:fixed; top:0; left:0; right:0; z-index:990; background:var(--dark1);
    padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.25); flex-wrap:wrap;}
  #toolbar .brand{color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  #toolbar .brand i{color:var(--orange);}
  
  .cloud-status { color:#a8b2d1; font-size:12px; display:flex; align-items:center; gap:6px; font-weight:700; }
  .cloud-status.saved { color:var(--green); }
  .cloud-status.error { color:#e74c3c; }

  #toolbar .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .t-divider { width:1px; height:24px; background:rgba(255,255,255,0.2); margin:0 4px;}

  .tbtn{border:none; padding:10px 18px; border-radius:6px; font-weight:700; font-size:13px;
    cursor:pointer; display:flex; align-items:center; gap:8px; transition:filter .15s ease, background .15s ease;}
  .tbtn:hover{filter:brightness(1.08);}
  .tbtn:disabled{opacity:.65; cursor:wait;}
  .mode-btn{background:#33475f; color:#fff;}
  .mode-btn.active{background:var(--orange); color:#fff;}
  #exportBtn{background:var(--orange); color:#fff;}
  .btn-logout{background:transparent; color:#a8b2d1; padding:10px; border:1px solid #a8b2d1;}
  .btn-logout:hover { background:rgba(255,255,255,0.1); color:#fff; }

  #layout{display:flex; align-items:flex-start; padding-top:70px;}

  /* ===== EDITOR PANEL ===== */
  #editorPanel{width:400px; min-width:400px; max-height:calc(100vh - 70px); overflow-y:auto;
    background:#fff; border-right:1px solid var(--border); padding:18px; display:none;}
  #layout.mode-edit #editorPanel{display:block; width:100%; min-width:0; max-width:1040px; margin:0 auto;
    border-right:none; max-height:none; padding:24px 30px 80px;}
  #layout.mode-preview #editorPanel{display:none;}
  #layout.mode-preview #previewArea{display:block;}
  #layout.mode-edit #previewArea{display:none;}
  #editorPanel h2{font-size:15px; color:var(--dark1); margin:0 0 12px; text-transform:uppercase; letter-spacing:.5px;}
  .ed-global{background:var(--bg-block); border-radius:6px; padding:12px; margin-bottom:18px;}
  .ed-field{margin-bottom:10px;}
  .ed-field label{display:block; font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase;}
  .ed-field input[type=text], .ed-field input[type=url], .ed-field textarea{
    width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:4px; font-size:12.5px; font-family:inherit;}
  .ed-field textarea{resize:vertical;}
  .ed-category{border:1px solid var(--border); border-radius:6px; margin-bottom:14px; overflow:hidden;}
  .ed-category-head{background:var(--bg-block); padding:8px 10px; display:flex; align-items:center; gap:6px;}
  .ed-category-head input[type=text]{flex:1; font-weight:700; font-size:12.5px; padding:6px 8px; border:1px solid var(--border); border-radius:4px;}
  .ed-icon-btn{background:none; border:1px solid var(--border); border-radius:4px; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); flex-shrink:0;}
  .ed-icon-btn:hover{background:#eef2f7;}
  .ed-icon-btn.danger:hover{background:#fde2e2; color:#c0392b;}
  .ed-icon-btn.active{color:var(--dark3);}
  .ed-category-body{padding:10px;}

  /* ===== ACORDEÓN ===== */
  .ed-intro{background:#eef4fb; border:1px solid #d7e6f7; border-radius:6px; padding:10px 12px;
    font-size:12px; color:var(--dark2); line-height:1.5; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;}
  .ed-intro i{margin-top:1px; flex-shrink:0;}
  .ed-toggle-btn{background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center;
    justify-content:center; width:22px; height:22px; flex-shrink:0; color:var(--dark2);}
  .ed-toggle-btn i{transition:transform .18s ease;}
  .ed-toggle-btn.is-open i{transform:rotate(90deg);}
  .ed-section{border:1px solid var(--border); border-radius:6px; margin-bottom:14px; overflow:hidden; background:#fff;}
  .ed-section-head{background:linear-gradient(90deg,#eef4fb,#f5f8fc); padding:12px 12px; display:flex;
    align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .ed-section-head:hover{background:#e5eef9;}
  .ed-section-title{flex:1; font-size:13px; font-weight:800; color:var(--dark1); display:flex; align-items:center; gap:8px;}
  .ed-section-title i{color:var(--dark3);}
  .ed-section-sub{font-size:10.5px; font-weight:600; color:var(--text-muted); text-transform:none;}
  .ed-section-body{padding:12px;}
  .ed-sub-collapsible{border:1px dashed var(--border); border-radius:5px; margin-bottom:8px; background:#fcfdfe; overflow:hidden;}
  .ed-sub-head{display:flex; align-items:center; gap:6px; padding:8px 9px; cursor:pointer; background:#fafbfc;}
  .ed-sub-head:hover{background:#f1f5fa;}
  .ed-sub-head input[type=text]{flex:1;}
  .ed-sub-body{padding:0 9px 9px;}
  .ed-product{border:1px dashed var(--border); border-radius:5px; padding:9px; margin-bottom:8px;}
  .ed-product-row{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .ed-product-row input[type=text]{flex:1;}
  .ed-add-btn{width:100%; background:#fff; border:1px dashed var(--dark3); color:var(--dark3);
    padding:8px; border-radius:5px; font-size:12px; font-weight:700; cursor:pointer; margin-top:4px;}
  .ed-add-btn:hover{background:#eef4fb;}
  .ed-add-cat-row{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .ed-add-cat-row select{flex:0 0 auto; font-size:12px; border:1px solid var(--border); border-radius:4px;}
  .ed-hint{font-size:11px; color:var(--text-muted); margin:2px 0 8px; line-height:1.4;}
  .ed-checkbox{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); margin-bottom:8px;}
  .ed-checkbox input[type=checkbox] { cursor:pointer; width:16px; height:16px; }

  .cat-type-badge{font-size:9.5px; font-weight:700; text-transform:uppercase; padding:4px 8px; border-radius:10px;
    background:#eef2f7; color:var(--text-muted); white-space:nowrap; flex-shrink:0;}

  /* ===== IMAGEN ===== */
  .ed-image-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .ed-image-row input[type=text]{flex:1; min-width:120px;}
  .ed-upload-btn{background:#eef2f7; border:1px solid var(--border); border-radius:4px; padding:7px 10px;
    font-size:11px; font-weight:700; color:var(--dark3); cursor:pointer; white-space:nowrap; display:flex;
    align-items:center; gap:5px; flex-shrink:0;}
  .ed-upload-btn:hover{background:#e2e8f0;}
  .ed-image-preview{max-width:100%; max-height:110px; object-fit:contain; margin-top:8px; display:block;
    border:1px solid var(--border); border-radius:4px; padding:4px; background:#fafbfc;}

  /* ===== BLOQUES DE CONTENIDO ===== */
  .ed-element{border:1px solid var(--border); border-radius:5px; padding:9px; margin-bottom:8px; background:#fcfdfe;}
  .ed-element-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .ed-element-type{flex:1; font-size:11px; font-weight:700; color:var(--dark3); text-transform:uppercase;
    display:flex; align-items:center; gap:6px;}
  .ed-subitem-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
  .ed-subitem-row input{flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; font-family:inherit;}
  .ed-subitem-row input.narrow{flex:0 0 54px;}
  .ed-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .ed-chip-btn{background:#fff; border:1px dashed var(--dark3); color:var(--dark3); padding:6px 10px;
    border-radius:14px; font-size:11px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px;}
  .ed-chip-btn:hover{background:#eef4fb;}

  /* ===== PREVIEW AREA ===== */
  #previewArea{flex:1; padding:24px 0 60px; overflow-x:auto;}
  #catalog-content{width:var(--page-w); margin:0 auto;}

  .pdf-page{width:var(--page-w); min-height:var(--page-h); background:#fff; position:relative;
    margin:0 auto 28px; box-shadow:0 6px 24px rgba(10,25,47,.18); overflow:hidden;
    page-break-after:always;}
  #catalog-content.exporting .pdf-page{margin-bottom:0; box-shadow:none;}

  .back-index{position:absolute; top:16px; right:20px; font-size:12px; color:var(--dark2);
    text-decoration:none; font-weight:700; display:flex; align-items:center; gap:7px; z-index:5; cursor:pointer;
    background:#fff; padding:9px 16px; border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,.25);
    transition:background .15s, color .15s, transform .15s;}
  .back-index:hover{background:var(--orange); color:#fff; transform:translateY(-1px); text-decoration:none;}
  .back-index i{font-size:11px;}
  .back-index-bottom{top:auto; bottom:16px; right:20px; flex-direction:row-reverse;
    background:var(--dark2); color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.18);}
  .back-index-bottom:hover{background:var(--orange); color:#fff;}
  .back-index-bottom i{transform:rotate(180deg);}

  .cover-page{position:relative; background:linear-gradient(135deg, var(--dark1) 0%, var(--dark2) 55%, var(--dark3) 100%);
    display:flex; flex-direction:column; justify-content:flex-end; padding:80px 70px; color:#fff;}
  
  /* MARCOS ARRASTRABLES */
  .image-frame{position:absolute; cursor:move; z-index:3; touch-action:none;}
  .image-frame img{width:100%; height:100%; display:block; object-fit:fill; pointer-events:none; user-select:none;}
  .ci-handle{position:absolute; width:14px; height:14px; background:var(--orange); border:2px solid #fff;
    border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.4); z-index:4; touch-action:none;}
  .ci-h-nw{top:-7px; left:-7px; cursor:nwse-resize;}
  .ci-h-n{top:-7px; left:50%; margin-left:-7px; cursor:ns-resize;}
  .ci-h-ne{top:-7px; right:-7px; cursor:nesw-resize;}
  .ci-h-e{top:50%; right:-7px; margin-top:-7px; cursor:ew-resize;}
  .ci-h-se{bottom:-7px; right:-7px; cursor:nwse-resize;}
  .ci-h-s{bottom:-7px; left:50%; margin-left:-7px; cursor:ns-resize;}
  .ci-h-sw{bottom:-7px; left:-7px; cursor:nesw-resize;}
  .ci-h-w{top:50%; left:-7px; margin-top:-7px; cursor:ew-resize;}
  
  #layout.mode-edit .image-frame{cursor:default;}
  #layout.mode-edit .ci-handle{display:none;}
  #catalog-content.exporting .ci-handle{display:none !important;}
  #catalog-content.exporting .image-frame{cursor:default;}
  
  .cover-page h1{font-size:50px; font-weight:900; letter-spacing:1px; margin:0 0 14px;}
  .cover-page .subtitle{font-size:18px; margin:0 0 40px; color:#dbe6f5;}
  .cover-contact{display:flex; flex-direction:column; gap:10px; font-size:14px; color:#c9d8ec;}
  .cover-contact p{margin:0; display:flex; align-items:center; gap:10px;}
  .cover-contact i{color:var(--orange); width:16px; text-align:center;}
  .cover-bottom-bar{height:10px; background:var(--orange);}

  .index-page{background:#e7edf5; padding:70px 60px;}
  .index-card{background:#fff; border-radius:4px; padding:44px 48px; box-shadow:0 2px 10px rgba(10,25,47,.06);}
  .index-card h2{font-size:24px; font-weight:700; color:var(--dark1); margin:0 0 14px; padding-bottom:14px; border-bottom:2px solid var(--border);}
  .index-list{list-style:none; margin:0; padding:0;}
  .index-list li{border-bottom:1px dotted var(--border);}
  .index-list a{display:flex; justify-content:space-between; align-items:center; padding:16px 4px;
    text-decoration:none; color:var(--dark1); font-weight:700; font-size:15.5px; cursor:pointer;}
  .index-list a:hover{color:var(--dark3);}
  .index-list a span{color:var(--orange); font-weight:700;}

  .section-banner{background:linear-gradient(90deg, var(--dark1), var(--dark2) 60%, var(--dark3));
    color:#fff; padding:20px 40px; font-size:19px; font-weight:700; border-left:8px solid var(--orange);}
  .section-body{padding:36px 44px;}
  .continuation-tag{display:block; font-size:11px; color:var(--text-muted); font-style:italic; margin:14px 44px -6px;}

  .info-image-page{display:flex; flex-direction:column;}
  .info-image-body{flex:1; position:relative; padding:0; overflow:hidden;}

  .info-block{background:var(--bg-block); border-left:4px solid var(--dark3); border-radius:2px;
    padding:26px 32px; margin-bottom:22px;}
  .info-block h3{margin:0 0 4px; font-size:17px; color:var(--dark1); font-weight:700;}
  .info-block .lead{font-style:italic; color:var(--text-muted); margin:0 0 14px; font-size:14px;}
  .info-block p{margin:0 0 12px; font-size:13.5px; line-height:1.65; color:#33425c;}
  .info-block p:last-child{margin-bottom:0;}

  .metrics-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px;}
  .metric-card{background:#fff; border:1px solid var(--border); border-radius:6px; padding:18px 10px; text-align:center;}
  .metric-card .num{font-size:26px; font-weight:900; color:var(--dark2);}
  .metric-card .label{font-size:11px; font-weight:700; color:var(--dark1); margin:6px 0 8px;}
  .metric-card .desc{font-size:10.5px; color:var(--text-muted); line-height:1.4;}

  .block-image{width:100%; max-height:340px; object-fit:cover; border-radius:6px; margin-bottom:6px; display:block;}
  .block-image-caption{font-size:11px; color:var(--text-muted); text-align:center; margin:0 0 14px; font-style:italic;}

  .values-list{margin:8px 0 0; padding:0; list-style:none;}
  .values-list li{font-size:13.5px; line-height:1.65; color:#33425c; margin-bottom:12px; padding-left:16px; position:relative;}
  .values-list li::before{content:"•"; color:var(--orange); font-weight:900; position:absolute; left:0;}
  .values-list li:last-child{margin-bottom:0;}
  .values-list b{color:var(--dark1);}
  .closing-tagline{text-align:center; font-weight:700; color:var(--dark2); font-size:14px; margin-top:16px;}

  .cta-whatsapp{display:inline-flex; align-items:center; gap:9px; background:var(--green); color:#fff;
    padding:13px 22px; border-radius:5px; font-weight:700; font-size:13px; text-decoration:none; margin-top:6px;}

  .product-card{display:grid; grid-template-columns:230px 1fr; gap:0; background:#fff; border:1px solid var(--border);
    border-left:4px solid var(--dark2); border-radius:4px; margin-bottom:18px; overflow:hidden;}
  .product-media{background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0; border-right:1px solid var(--border);}
  .media-icon{width:74px; height:74px; border-radius:50%; background:linear-gradient(135deg, var(--dark2), var(--dark3));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; margin:40px 0;}
  .product-img{width:100%; height:100%; min-height:200px; object-fit:cover; display:block;}
  
  .product-info{padding:18px 22px;}
  .product-info h3{margin:0 0 10px; font-size:15.5px; color:var(--dark1); font-weight:700;}
  .product-info ul{margin:0 0 16px; padding:0; list-style:none;}
  .product-info li{font-size:12.5px; color:#33425c; padding:4px 0 4px 14px; position:relative; line-height:1.4;}
  .product-info li::before{content:"•"; color:var(--dark3); position:absolute; left:0; font-weight:900;}
  .product-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:5px; font-size:12px;
    font-weight:700; text-decoration:none; color:#fff; border:none; cursor:pointer;}
  .btn-orange{background:var(--orange);}
  .btn-green{background:var(--green);}

  #measureSandbox{position:absolute; top:0; left:-99999px; visibility:hidden;}
  @media (max-width:1200px){ #editorPanel{width:340px; min-width:340px;} }
  @media (max-width:900px){
    #layout{flex-direction:column;}
    #editorPanel{width:100%; min-width:0; max-height:none;}
    #previewArea{width:100%;}
  }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <h2><i class="fa-solid fa-lock"></i> Acceso al Catálogo</h2>
    <input type="email" id="loginEmail" placeholder="Correo electrónico (ej: admin@neyra.com)">
    <input type="password" id="loginPassword" placeholder="Contraseña">
    <div id="loginError" class="login-error">Usuario o contraseña incorrectos.</div>
    <button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión</button>
  </div>
</div>

<div id="appContainer">
  <div id="toolbar">
    <div class="brand"><i class="fa-solid fa-microchip"></i> NEYRA SERVICIOS · Catálogo Editable</div>
    
    <div class="actions">
      <!-- Indicador de guardado en la nube -->
      <span id="cloudStatus" class="cloud-status saved"><i class="fa-solid fa-cloud-check"></i> Sincronizado</span>
      
      <div class="t-divider"></div>
      
      <button class="tbtn mode-btn" id="previewModeBtn" onclick="setMode('preview')"><i class="fa-solid fa-eye"></i> Vista previa</button>
      <button class="tbtn mode-btn" id="editModeBtn" onclick="setMode('edit')"><i class="fa-solid fa-pen"></i> Modo edición</button>
      <button class="tbtn" id="exportBtn" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf"></i> Descargar PDF</button>
      <button class="tbtn btn-logout" onclick="logout()" title="Cerrar sesión"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>
  </div>

  <div id="layout" class="mode-preview">
    <div id="editorPanel">
      <h2><i class="fa-solid fa-sliders"></i> Panel de edición</h2>
      <div id="editorPanelInner"></div>
    </div>
    <div id="previewArea">
      <div id="catalog-content"></div>
    </div>
  </div>
</div>

<div id="measureSandbox"></div>

<script>
/* =========================================================
   CONFIGURACIÓN DE FIREBASE (PEGAR CLAVES AQUÍ)
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDfBQUwmtFkrf04TCJsosG974rjXeUAzhY",
  authDomain: "catalogo-neyra.firebaseapp.com",
  projectId: "catalogo-neyra",
  storageBucket: "catalogo-neyra.firebasestorage.app",
  messagingSenderId: "54450451989",
  appId: "1:54450451989:web:a0d30c4080411baf36001c"
};

// Inicializa Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =========================================================
   SISTEMA DE AUTENTICACIÓN
========================================================= */
function login() {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;
  const errorMsg = document.getElementById('loginError');
  
  if(!email || !pass) {
    errorMsg.innerText = "Completá todos los datos";
    errorMsg.style.display = "block";
    return;
  }
  
  auth.signInWithEmailAndPassword(email, pass).catch((error) => {
    errorMsg.innerText = "Error: Verifica tu correo y contraseña";

/* =========================================================
   AUTOGUARDADO EN FIREBASE
========================================================= */
var saveTimeout = null;
var cloudStatusEl = document.getElementById('cloudStatus');

function autoSaveToCloud() {
  // Si no está logueado, no guarda
  if(!auth.currentUser) return;
  
  cloudStatusEl.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Guardando...';
  cloudStatusEl.className = 'cloud-status';
  
  // Espera 1.5 segundos de inactividad antes de guardar para no saturar la nube
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    // Guarda toda la variable 'state' en la base de datos de Firebase
    db.collection('catalogos').doc('neyra_principal').set(state)
      .then(() => {
        cloudStatusEl.innerHTML = '<i class="fa-solid fa-cloud"></i> Guardado';
        cloudStatusEl.className = 'cloud-status saved';
      })
      .catch((error) => {
        console.error("Error guardando en la nube:", error);
        cloudStatusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Error al guardar';
        cloudStatusEl.className = 'cloud-status error';
        alert("Atención: El catálogo superó el peso límite (1 MB). Recuerda no subir imágenes pesadas directamente. Pega links de Google Drive para las fotos.");
      });
  }, 1500);
}

function cargarDesdeLaNube() {
  cloudStatusEl.innerHTML = '<i class="fa-solid fa-rotate"></i> Cargando...';
  
  db.collection('catalogos').doc('neyra_principal').get().then((doc) => {
    if (doc.exists) {
      state = migrateState(doc.data());
      cloudStatusEl.innerHTML = '<i class="fa-solid fa-cloud"></i> Sincronizado';
    } else {
      // Si no existe, guarda el estado por defecto que ya tenemos cargado
      state = migrateState(defaultState());
      autoSaveToCloud();
    }
    // Dibuja el catálogo con los datos cargados
    renderEditorPanel();
    renderPreview();
  }).catch((error) => {
    console.error("Error obteniendo documento:", error);
    cloudStatusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Error de carga';
  });
}

function migrateBlock(block){
  if(block.elements) return block;
  var elements = [];
  if(block.lead) elements.push({type:'subtitle', text:block.lead});
  (block.paragraphs||[]).forEach(function(p){ elements.push({type:'paragraph', text:p}); });
  if(block.metrics && block.metrics.length){
    elements.push({type:'metrics', items: block.metrics.map(function(m){ return {num:m.num, label:m.label, desc:m.desc}; })});
  }
  if(block.values && block.values.length){
    elements.push({type:'values', items: block.values.map(function(v){ return {title:v.title, text:v.text}; })});
  }
  if(block.tagline) elements.push({type:'tagline', text:block.tagline});
  if(block.cta) elements.push({type:'cta', label:block.cta.label, message:block.cta.message});
  block.elements = elements;
  delete block.lead; delete block.paragraphs; delete block.metrics; delete block.values; delete block.tagline; delete block.cta;
  return block;
}
function migrateState(st){
  st.categories.forEach(function(cat){
    if(cat.type === 'content'){ (cat.blocks||[]).forEach(migrateBlock); }
  });
  if(!('showCover' in st.company)) st.company.showCover = true;
  if(!('showIndex' in st.company)) st.company.showIndex = true;
  if(!('coverImage' in st.company)) st.company.coverImage = '';
  if(!('coverImageX' in st.company) || !('coverImageW' in st.company)){
    var legacyW = st.company.coverImageSize || 210;
    st.company.coverImageW = legacyW;
    st.company.coverImageH = Math.round(legacyW * 1.25);
    st.company.coverImageX = 900 - 60 - legacyW;
    st.company.coverImageY = 60;
  }
  if(!('coverImageY' in st.company)) st.company.coverImageY = 60;
  if(!('coverImageH' in st.company)) st.company.coverImageH = 260;
  return st;
}

function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function waLink(message){
  return 'https://wa.me/' + encodeURIComponent(state.whatsapp) + '?text=' + encodeURIComponent(message||'');
}

/* Convierte links de Google Drive a link directo de imagen */
function driveImg(url){
  if(!url) return '';
  var m = url.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/)
       || url.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?(?:[^#]*&)?id=([^&#]+)/)
       || url.match(/docs\.google\.com\/.*\/d\/([^\/?#]+)/);
  if(m) return 'https://lh3.googleusercontent.com/d/' + m[1] + '=w1200';
  return url;
}

  return state.company.showCover ? 2 : 1;

/* ---- Imágenes: por link o por archivo subido ---- */
function renderImageField(label, value, urlOninput, uploadTarget, idSuffix){
  var fileId = 'imgfile_' + idSuffix;
  var html = '<div class="ed-field ed-image-field"><label>'+label+'</label>';
  html += '<div class="ed-image-row">';
  html += '<input type="text" placeholder="Pegar link (ej: Drive) ¡RECOMENDADO!" value="'+escapeHtml(value||'')+'" oninput="'+urlOninput+'">';
  html += '<label class="ed-upload-btn" for="'+fileId+'"><i class="fa-solid fa-upload"></i> Subir archivo (No usar en Firebase)</label>';
  html += '<input type="file" id="'+fileId+'" accept="image/*" style="display:none" onchange="readImageFile(this, \''+uploadTarget+'\')">';
  html += '</div>';
  if(value) html += '<img class="ed-image-preview" referrerpolicy="no-referrer" src="'+escapeHtml(driveImg(value))+'">';
  html += '</div>';
  return html;
}
function setImageValue(target, dataUrl){
  var parts = target.split(':');
  if(parts[0]==='cover'){
    state.company.coverImage = dataUrl;
  } else if(parts[0]==='product'){
    state.categories[parts[1]].products[parts[2]].image = dataUrl;
  } else if(parts[0]==='infoimg'){
    state.categories[parts[1]].products[parts[2]].infoImage = dataUrl;
  } else if(parts[0]==='element'){
    state.categories[parts[1]].blocks[parts[2]].elements[parts[3]].src = dataUrl;
  }
}
function readImageFile(inputEl, target){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ setImageValue(target, e.target.result); renderAll(); };
  reader.readAsDataURL(file);
}

function buildContentBlockHTML(block){
  var html = '<div class="info-block">';
  if(block.heading) html += '<h3>'+escapeHtml(block.heading)+'</h3>';
  (block.elements||[]).forEach(function(el){
    switch(el.type){
      case 'subtitle':
        if(el.text) html += '<p class="lead">'+escapeHtml(el.text)+'</p>';
        break;
      case 'paragraph':
        if(el.text && el.text.trim()!=='') html += '<p>'+escapeHtml(el.text)+'</p>';
        break;
      case 'tagline':
        if(el.text) html += '<p class="closing-tagline">'+escapeHtml(el.text)+'</p>';
        break;
      case 'values':
        if(el.items && el.items.length){
          html += '<ul class="values-list">';
          el.items.forEach(function(v){ html += '<li><b>'+escapeHtml(v.title)+':</b> '+escapeHtml(v.text)+'</li>'; });
          html += '</ul>';
        }
        break;
      case 'metrics':
        if(el.items && el.items.length){
          html += '<div class="metrics-grid">';
          el.items.forEach(function(m){ html += '<div class="metric-card"><div class="num">'+escapeHtml(m.num)+'</div><div class="label">'+escapeHtml(m.label)+'</div><div class="desc">'+escapeHtml(m.desc)+'</div></div>'; });
          html += '</div>';
        }
        break;
      case 'image':
        if(el.src){
          html += '<img class="block-image" referrerpolicy="no-referrer" src="'+escapeHtml(driveImg(el.src))+'">';
          if(el.caption) html += '<div class="block-image-caption">'+escapeHtml(el.caption)+'</div>';
        }
        break;
      case 'cta':
        if(el.label){
          html += '<a class="cta-whatsapp link-annot" target="_blank" rel="noopener" href="'+waLink(el.message)+'"><i class="fa-brands fa-whatsapp"></i> '+escapeHtml(el.label)+'</a>';
        }
        break;
    }
  });
  html += '</div>';
  return html;
}

    backBottom.setAttribute('data-target-page', idxPage);
    backBottom.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Volver al índice';
    backBottom.onclick = function(){ scrollToPage(idxPage); };
    page.appendChild(backBottom);
  }

  var banner = document.createElement('div');
  banner.className = 'section-banner';
  banner.textContent = cat.title;
  page.appendChild(banner);

  if(isContinuation){
    var tag = document.createElement('span');
    tag.className = 'continuation-tag';
    tag.textContent = 'Continuación';
    page.appendChild(tag);
  }

  var body = document.createElement('div');
  body.className = 'section-body';
  page.appendChild(body);

  return {page: page, body: body};
}

function paginateCategories(categories){
  var sandbox = document.getElementById('measureSandbox');
  sandbox.innerHTML = '';
  var pages = [];
  var current = null;

  function pageHeight(){ return current.page.getBoundingClientRect().height; }

  function newPage(cat, isCont){
    if(current) pages.push(current.page);
    current = createPageShell(cat, isCont);
    sandbox.appendChild(current.page);
  }

  function addBlockNode(cat, node){
    current.body.appendChild(node);
    if(pageHeight() > PAGE_H && current.body.children.length > 1){
      current.body.removeChild(node);
      newPage(cat, true);
      current.body.appendChild(node);
    }
  }

  categories.filter(function(c){ return c.visible; }).forEach(function(cat){
    newPage(cat, false);
    if(cat.type === 'products'){
      cat.products.filter(function(p){ return p.visible; }).forEach(function(prod){
        var wrap = document.createElement('div');
        wrap.innerHTML = buildProductCardHTML(cat, prod);
        addBlockNode(cat, wrap.firstElementChild);
      });
    } else {
      (cat.blocks || []).forEach(function(block){
        var wrap = document.createElement('div');
        wrap.innerHTML = buildContentBlockHTML(block);
        addBlockNode(cat, wrap.firstElementChild);
      });
    }
  });
  if(current) pages.push(current.page);
  return pages;
}

/* =========================================================
   RENDER PRINCIPAL DE LA VISTA PREVIA
========================================================= */
function renderPreview(){
  var contentPages = paginateCategories(state.categories);

  var pageQueue = [];
  var idx = 0;
  while(idx < contentPages.length){
    var cid = contentPages[idx].dataset.categoryId;
    while(idx < contentPages.length && contentPages[idx].dataset.categoryId === cid){
      pageQueue.push({node: contentPages[idx]});
      idx++;
    }
    var cat = state.categories.filter(function(c){ return String(c.id) === String(cid); })[0];
    if(cat && cat.type === 'products'){
      cat.products.forEach(function(prod){
        if(prod.infoImage && prod.infoImage.indexOf('data:') === 0){
          pageQueue.push({infoPage: true, cat: cat, prod: prod});
        }
      });
    }
  }

  var catFirstPage = {};
  var infoPageMap = {}; 
  var finalPages = [];
  
  var offset = 0;
  if (state.company.showCover) offset++;
  if (state.company.showIndex) offset++;
  
  pageQueue.forEach(function(item, i){
    var pageNum = i + offset + 1;
    if(item.infoPage){
      infoPageMap[item.prod.id] = pageNum;
      finalPages.push(buildInfoImagePage(item.cat, item.prod));
    } else {
      var cid2 = item.node.dataset.categoryId;
      if(!(cid2 in catFirstPage)) catFirstPage[cid2] = pageNum;
      finalPages.push(item.node);
    }
  });

  var container = document.getElementById('catalog-content');
  container.innerHTML = '';
  
  if(state.company.showCover) container.appendChild(buildCoverPage());
  if(state.company.showIndex){
    var indexPage = buildIndexPage(catFirstPage);
    container.appendChild(indexPage);
  }
  finalPages.forEach(function(p){ container.appendChild(p); });

  container.querySelectorAll('a.more-info-btn[data-product-id]').forEach(function(a){
    var pid = a.getAttribute('data-product-id');
    var pageNum = infoPageMap[pid];
    if(pageNum){
      a.setAttribute('data-target-page', pageNum);
      a.href = 'javascript:void(0)';
      a.removeAttribute('target');
      a.onclick = function(){ scrollToPage(pageNum); };
    }
  });
}

function renderAll(){
  // Llamamos a la función de autoguardado de la nube
  autoSaveToCloud();
  renderEditorPanel();
  renderPreview();
}

            html += '<button class="ed-chip-btn" onclick="addElement('+ci+','+bi+',\''+t+'\')"><i class="'+meta.icon+'"></i> '+meta.label+'</button>';
          });
          html += '</div>';
          html += '</div>';
        }

        html += '</div>';
      });
      html += '<button class="ed-add-btn" onclick="addContentBlock('+ci+')"><i class="fa-solid fa-plus"></i> Agregar bloque de servicio</button>';
    }

    html += '</div></div>';
  });

  html += '<div class="ed-hint">Agregar nueva categoría:</div>';
  html += '<div class="ed-add-cat-row">';
  html += '<button class="ed-add-btn" onclick="addCategory(\'products\')"><i class="fa-solid fa-box"></i> Categoría de Productos</button>';
  html += '<button class="ed-add-btn" onclick="addCategory(\'content\')"><i class="fa-solid fa-file-lines"></i> Categoría de Servicios</button>';
  html += '</div>';

  document.getElementById('editorPanelInner').innerHTML = html;
}

/* =========================================================
   EXPORTACIÓN A PDF (con índice y botones funcionando)
========================================================= */
function addAllPdfLinks(pdf, pages){
  pages.forEach(function(pageEl, idx){
    var pageNumber = idx + 1;
    var pageRect = pageEl.getBoundingClientRect();
    pdf.setPage(pageNumber);
    pageEl.querySelectorAll('a.link-annot').forEach(function(a){
      var rect = a.getBoundingClientRect();
      var x = rect.left - pageRect.left;
      var y = rect.top - pageRect.top;
      var w = rect.width;
      var h = rect.height;
      if(w <= 0 || h <= 0) return;

      var targetPage = a.getAttribute('data-target-page');
      if(targetPage){
        pdf.link(x, y, w, h, { pageNumber: parseInt(targetPage, 10) });
      } else {
        var href = a.getAttribute('href') || '';
        if(/^(https?:|tel:|mailto:)/i.test(href)){
          pdf.link(x, y, w, h, { url: href });
        }
      }
    });
  });
}

async function exportToPDF(){
  renderPreview();

  var container = document.getElementById('catalog-content');
  var pages = Array.prototype.slice.call(container.children);
  var btn = document.getElementById('exportBtn');
  var originalLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando PDF...';
  btn.disabled = true;
  container.classList.add('exporting');

  try{
    var jsPDFCtor = window.jspdf.jsPDF;
    var pdf = new jsPDFCtor({ unit: 'px', format: [PAGE_W, PAGE_H], orientation: 'portrait' });

    for(var i = 0; i < pages.length; i++){
      var pageEl = pages[i];
      var pageHeightPx = Math.max(PAGE_H, Math.ceil(pageEl.getBoundingClientRect().height));
      var canvas = await html2canvas(pageEl, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        width: PAGE_W,
        height: pageHeightPx,
        windowWidth: PAGE_W
      });
      var imgData = canvas.toDataURL('image/jpeg', 0.96);
      if(i > 0){ pdf.addPage([PAGE_W, PAGE_H], 'portrait'); }
      pdf.addImage(imgData, 'JPEG', 0, 0, PAGE_W, PAGE_H);
    }

    addAllPdfLinks(pdf, pages);
    pdf.save('Neyra_Servicios_Catalogo.pdf');
  } catch(err){
    console.error('Error generando PDF:', err);
    alert('Ocurrió un error al generar el PDF. Revisá la consola para más detalles.');
  } finally {
    container.classList.remove('exporting');
    btn.innerHTML = originalLabel;
    btn.disabled = false;
  }
}

/* =========================================================
   SISTEMA DE ARRASTRE DE IMÁGENES (PORTADA Y MAS INFO)
========================================================= */
var ciDrag = null;

function clampNum(v, min, max){ return Math.min(Math.max(v, min), max); }

function isPreviewMode(){
  var layout = document.getElementById('layout');
  return !!layout && layout.classList.contains('mode-preview');
}

function updateImageFrameStyle(frame, obj, wProp, hProp, xProp, yProp){
  if(!frame) return;
  frame.style.left = obj[xProp] + 'px';
  frame.style.top = obj[yProp] + 'px';
  frame.style.width = obj[wProp] + 'px';
  frame.style.height = obj[hProp] + 'px';
}

function coverPointerPos(e){
  if(e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onCoverPointerDown(e){
  if(!isPreviewMode()) return;
  var target = e.target;
  if(!target || !target.closest) return;
  var handle = target.closest('.ci-handle');
  var frame = target.closest('.image-frame');
  if(!frame) return;
  
  var type = frame.getAttribute('data-frame-type');
  var obj, xProp, yProp, wProp, hProp;
  
  if(type === 'cover'){
    obj = state.company;
    xProp = 'coverImageX'; yProp = 'coverImageY'; wProp = 'coverImageW'; hProp = 'coverImageH';
  } else if (type === 'info') {
    var cid = frame.getAttribute('data-c-id');
    var pid = frame.getAttribute('data-p-id');
    var cat = state.categories.filter(function(c){ return String(c.id) === String(cid); })[0];
    obj = cat.products.filter(function(p){ return String(p.id) === String(pid); })[0];
    xProp = 'infoImageX'; yProp = 'infoImageY'; wProp = 'infoImageW'; hProp = 'infoImageH';
  }

  var pos = coverPointerPos(e);
  ciDrag = {
    type: handle ? 'resize' : 'move',
    dir: handle ? handle.getAttribute('data-dir') : null,
    obj: obj, xProp: xProp, yProp: yProp, wProp: wProp, hProp: hProp,
    startX: pos.x,
    startY: pos.y,
    start: { x: obj[xProp], y: obj[yProp], w: obj[wProp], h: obj[hProp] },
    frame: frame
  };
  e.preventDefault();
}

function onCoverPointerMove(e){
  if(!ciDrag) return;
  var pos = coverPointerPos(e);
  var dx = pos.x - ciDrag.startX;
  var dy = pos.y - ciDrag.startY;
  var s = ciDrag.start;
  var MIN = 30;

  if(ciDrag.type === 'move'){
    ciDrag.obj[ciDrag.xProp] = clampNum(s.x + dx, -(s.w - 40), PAGE_W - 40);
    ciDrag.obj[ciDrag.yProp] = clampNum(s.y + dy, -(s.h - 40), PAGE_H - 40);
  } else {
    var dir = ciDrag.dir || '';
    var newX = s.x, newY = s.y, newW = s.w, newH = s.h;
    var isCorner = (dir === 'nw' || dir === 'ne' || dir === 'se' || dir === 'sw');
    if(isCorner){
      var ratio = s.w / s.h;
      var deltaW = dir.indexOf('e') >= 0 ? dx : (dir.indexOf('w') >= 0 ? -dx : 0);
      var deltaH = dir.indexOf('s') >= 0 ? dy : (dir.indexOf('n') >= 0 ? -dy : 0);
      if(Math.abs(deltaW) > Math.abs(deltaH * ratio)){
        newW = Math.max(MIN, s.w + deltaW);
        newH = Math.max(MIN, newW / ratio);
      } else {
        newH = Math.max(MIN, s.h + deltaH);
        newW = Math.max(MIN, newH * ratio);
      }
      newX = dir.indexOf('w') >= 0 ? s.x + (s.w - newW) : s.x;
      newY = dir.indexOf('n') >= 0 ? s.y + (s.h - newH) : s.y;
    } else {
      if(dir.indexOf('e') >= 0){ newW = Math.max(MIN, s.w + dx); }
      if(dir.indexOf('w') >= 0){ newW = Math.max(MIN, s.w - dx); newX = s.x + (s.w - newW); }
      if(dir.indexOf('s') >= 0){ newH = Math.max(MIN, s.h + dy); }
      if(dir.indexOf('n') >= 0){ newH = Math.max(MIN, s.h - dy); newY = s.y + (s.h - newH); }
    }
    ciDrag.obj[ciDrag.xProp] = newX; ciDrag.obj[ciDrag.yProp] = newY; 
    ciDrag.obj[ciDrag.wProp] = newW; ciDrag.obj[ciDrag.hProp] = newH;
  }
  
  updateImageFrameStyle(ciDrag.frame, ciDrag.obj, ciDrag.wProp, ciDrag.hProp, ciDrag.xProp, ciDrag.yProp);
  e.preventDefault();
  
  autoSaveToCloud(); // Guarda al soltar/mover imágenes
}

function onCoverPointerUp(){
  ciDrag = null;
}

(function initCoverImageDrag(){
  var content = document.getElementById('catalog-content');
  content.addEventListener('mousedown', onCoverPointerDown);
  content.addEventListener('touchstart', onCoverPointerDown, { passive:false });
  document.addEventListener('mousemove', onCoverPointerMove);
  document.addEventListener('touchmove', onCoverPointerMove, { passive:false });
  document.addEventListener('mouseup', onCoverPointerUp);
  document.addEventListener('touchend', onCoverPointerUp);
  document.addEventListener('touchcancel', onCoverPointerUp);
})();

</script>
